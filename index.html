<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<title>愤怒的小鸟2网页版</title>
		<link rel="stylesheet" type="text/css" href="./style.css" />
	</head>
	<body>
		<div id="unityContainer">
			<div id="loading">
				<div id="butdiv">
					<button id="playbut">开始游戏</button>
					<a id="moregame" href="https://gamebox.heheda.top" target="_blank">更多游戏</a>
				</div>
				<div id="textdiv">
					<p id="hb">若长时间停留此页面，请尝试刷新网页，或更换网络环境后重试！</p>
					<div class="spinner"></div>
					<p id="loadingText">准备初始化...</p>
				</div>
			</div>
			<p class="footer">由 <a class="cf" href="https://www.cloudflare.com" target="_blank"
					rel="noopener noreferrer nofollow"><img src="./images/other/cloudflare.ico"
						alt="Cloudflare">Cloudflare</a> 和 <a class="eo" href="https://curl.qcloud.com/0f8yZ85J"
					target="_blank" rel="noopener noreferrer nofollow"><img src="./images/other/edgeone.ico"
						alt="EdgeOne">EdgeOne</a> 提供CDN服务
			</p>
		</div>
		<button id="fullscreenBtn">全屏</button>
		<script defer type='text/javascript' src="./script/script.js"></script>
		<!-- 谷歌广告 -->
		<script async
			src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3670070169085381"
			crossorigin="anonymous"></script>
	</body>
</html>
